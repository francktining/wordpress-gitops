apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: wordpress
  namespace: wordpress

spec:
  project: default

  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: wordpress
    targetRevision: 24.1.10

    helm:
      values: |
        service:
          type: NodePort

  destination:
    server: https://kubernetes.default.svc
    namespace: wordpress

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
