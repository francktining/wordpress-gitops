apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: wordpress
  namespace: argocd

spec:
  project: default

  source:
    repoURL: registry-1.docker.io
    chart: bitnamicharts/wordpress
    targetRevision: 24.1.1

    helm:
      values: |
        service:
          type: NodePort

  destination:
    server: https://kubernetes.default.svc
    namespace: wordpress

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
